name: OpenRV

on:
  push:
    branches:
      # This will run when PR is merged or direct pushes to main.
      - main

  pull_request: # This handles PR creation and subsequent commits.

  schedule:
    # Midnight build every day
    - cron: "0 0 * * *"

  # This allows manual triggering of the workflow from the web
  workflow_dispatch:
    inputs:
      SKIP_DEPS_CACHE:
        description: 'Skip dependencies caching'
        required: true
        default: 'false'

# Whether the build matrix runs at all.
#
# Upstream always runs. A fork can also run the full matrix, either by dispatching this workflow manually or by setting the RV_CI_ON_FORK repository variable to
# 'true'. With neither of those true the behaviour is exactly as before.
#
# A cheap push-triggered validation of the build-identity layer lives in validate-identity.yml instead, so that iterating on it does not cost a full matrix.
#
# The condition is written out on each job rather than held in a workflow-level env variable: a job-level `if` cannot read the `env` context (only github, needs,
# strategy, matrix, inputs and vars are available there), and referencing it fails workflow validation outright with "Unrecognized named-value: 'env'", producing
# a run with no jobs at all.
#
# Only this workflow is opened up. conan.yml, release.yml, release-pr.yml and semantic-pull-request.yml stay upstream-only: they need the ASWF Conan remote's
# credentials or write to the repository.
#
jobs:
  detect-changes:
    if: github.repository_owner == 'AcademySoftwareFoundation' || github.event_name == 'workflow_dispatch' || vars.RV_CI_ON_FORK == 'true'
    runs-on: ubuntu-latest
    outputs:
      cmake_changed: ${{ steps.filter.outputs.cmake }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            cmake:
              - 'cmake/**'
              - '**/CMakeLists.txt'
              - '**/*.cmake'

  linux:
    if: github.repository_owner == 'AcademySoftwareFoundation' || github.event_name == 'workflow_dispatch' || vars.RV_CI_ON_FORK == 'true'
    needs: detect-changes
    uses: ./.github/workflows/ci-linux.yml
    with:
      skip_deps_cache: ${{ inputs.SKIP_DEPS_CACHE || 'false' }}
      full_matrix: ${{ github.event_name != 'pull_request' }}
      run_debug: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.cmake_changed == 'true' }}

  macos:
    if: github.repository_owner == 'AcademySoftwareFoundation' || github.event_name == 'workflow_dispatch' || vars.RV_CI_ON_FORK == 'true'
    needs: detect-changes
    uses: ./.github/workflows/ci-macos.yml
    with:
      skip_deps_cache: ${{ inputs.SKIP_DEPS_CACHE || 'false' }}
      full_matrix: ${{ github.event_name != 'pull_request' }}
      run_debug: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.cmake_changed == 'true' }}

  windows:
    if: github.repository_owner == 'AcademySoftwareFoundation' || github.event_name == 'workflow_dispatch' || vars.RV_CI_ON_FORK == 'true'
    needs: detect-changes
    uses: ./.github/workflows/ci-windows.yml
    with:
      skip_deps_cache: ${{ inputs.SKIP_DEPS_CACHE || 'false' }}
      full_matrix: ${{ github.event_name != 'pull_request' }}
      run_debug: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.cmake_changed == 'true' }}